name: Desktop release and platform proofs

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Prepared version in tag format (vYYYY.W.N)"
        required: true
        type: string
      release_candidate:
        description: "Build and verify all signed packages, then create the tag and unpublished draft"
        type: boolean
        default: false
      proof_platform:
        description: "Platforms for a proof run"
        type: choice
        default: windows
        options: [windows, linux, macos, all]
      macos_proof_run_id:
        description: "Optional existing signed DMG run to recheck; signed macOS proofs only"
        type: string
        default: ""
      sign_proof:
        description: "Sign selected proof packages with existing organisation credentials; never create a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_candidate && inputs.release_tag || github.ref_name }}-${{ (inputs.release_candidate || github.event_name == 'push') && 'release' || inputs.proof_platform }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-22.04
    outputs:
      windows: ${{ steps.route.outputs.build_windows }}
      linux: ${{ steps.route.outputs.build_linux }}
      macos: ${{ steps.route.outputs.build_macos }}
      version: ${{ steps.route.outputs.version }}
      sign: ${{ steps.route.outputs.sign }}
      create_draft: ${{ steps.route.outputs.create_draft }}
      tag: ${{ steps.route.outputs.tag }}
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test native UI version verifier
        run: python3 -m unittest discover -s tools/desktop-acceptance -p test_ui.py
      - id: route
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          INPUT_SIGN_PROOF: ${{ inputs.sign_proof }}
          INPUT_PROOF_PLATFORM: ${{ inputs.proof_platform }}
          INPUT_MACOS_PROOF_RUN_ID: ${{ inputs.macos_proof_run_id }}
        run: |
          node tools/release.mjs workflow --github-output
          if [[ "$INPUT_RELEASE_CANDIDATE" == 'true' ]]; then
            node tools/release.mjs check --tag "$INPUT_RELEASE_TAG" --publish
          fi
  windows:
    needs: route
    if: needs.route.outputs.windows == 'true'
    name: Test and build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pile-plan-studio/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install frontend dependencies
        working-directory: apps/pile-plan-studio
        run: npm ci

      - name: Validate prepared version and workflow route
        id: release
        working-directory: apps/pile-plan-studio
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          INPUT_SIGN_PROOF: ${{ inputs.sign_proof }}
        run: npm run release:workflow -- --github-output

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test frontend
        working-directory: apps/pile-plan-studio
        run: npm test

      - name: Test Tauri shell
        run: cargo test --manifest-path apps/pile-plan-studio/src-tauri/Cargo.toml

      - name: Build app before packaging
        working-directory: apps/pile-plan-studio
        run: npm run tauri build -- --no-bundle

      # Bootstrap Azure's supported signing tools using our freshly built app.
      # Bundling patches the app again, so Tauri must sign it again afterwards.
      - name: Install Azure tools and sign the built app
        if: steps.release.outputs.sign == 'true'
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          cache-dependencies: false
          files: ${{ github.workspace }}/apps/pile-plan-studio/src-tauri/target/release/pile-plan-studio.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Configure Tauri signing during packaging
        if: steps.release.outputs.sign == 'true'
        shell: pwsh
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: ./tools/configure_windows_signing.ps1 -OutputDirectory "$env:RUNNER_TEMP/pile-plan-signing"

      - name: Bundle and sign app, uninstaller and installer
        if: steps.release.outputs.sign == 'true'
        working-directory: apps/pile-plan-studio
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run tauri bundle -- --bundles nsis --config "$env:RUNNER_TEMP/pile-plan-signing/tauri.windows-signing.json"

      - name: Bundle unsigned proof
        if: steps.release.outputs.sign != 'true'
        working-directory: apps/pile-plan-studio
        run: npm run tauri bundle -- --bundles nsis

      - name: Recheck generated package versions
        working-directory: apps/pile-plan-studio
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run release:check -- --tag "$env:RELEASE_TAG"

      - name: Locate installer and verify release signature
        id: installer
        shell: pwsh
        env:
          VERIFY_SIGNATURE: ${{ steps.release.outputs.sign }}
        run: |
          $installers = @(Get-ChildItem "apps/pile-plan-studio/src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]

          if ($env:VERIFY_SIGNATURE -eq 'true') {
            . ./tools/windows_signatures.ps1
            Assert-WindowsFileSignature -Path $installer.FullName | Format-List
          }

          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Test installer version, installation, and launch
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          UNSIGNED_PROOF: ${{ steps.release.outputs.sign != 'true' }}
        run: |
          ./tools/test_windows_installer.ps1 -InstallerPath $env:INSTALLER_PATH -ExpectedVersion $env:EXPECTED_VERSION -UnsignedProof:($env:UNSIGNED_PROOF -eq 'true')

      - name: Upload proof binaries and signature report
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.release.outputs.mode }}-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/pile-plan-windows-proof
          if-no-files-found: error

      - name: Collect Windows installer
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          New-Item -ItemType Directory -Path windows-packages | Out-Null
          Copy-Item -LiteralPath $env:INSTALLER_PATH -Destination windows-packages
          node tools/release-assets.mjs normalize windows-packages
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages-${{ github.sha }}
          path: windows-packages/
          if-no-files-found: error

  linux:
    needs: route
    if: needs.route.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pile-plan-studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev curl wget file patchelf gnupg libfuse2 xvfb dbus-x11 xdotool
      - run: npm ci
        working-directory: apps/pile-plan-studio
      - run: cargo test --workspace --locked
      - run: cargo test --locked --manifest-path apps/pile-plan-studio/src-tauri/Cargo.toml
      - run: npm test
        working-directory: apps/pile-plan-studio
      - name: Test Linux signing with disposable key
        run: bash tools/tests/linux-signing.test.sh
      - name: Build Linux packages
        working-directory: apps/pile-plan-studio
        run: npm run tauri -- build --bundles deb,appimage
      - name: Collect exact package pair
        shell: bash
        run: |
          mkdir linux-packages
          cp apps/pile-plan-studio/src-tauri/target/release/bundle/deb/*.deb linux-packages/
          cp apps/pile-plan-studio/src-tauri/target/release/bundle/appimage/*.AppImage linux-packages/
          test "$(find linux-packages -type f | wc -l)" -eq 2
          node tools/release-assets.mjs normalize linux-packages
      - name: Sign Linux downloads
        if: needs.route.outputs.sign == 'true'
        env:
          OPENAEC_GPG_PRIVATE_KEY: ${{ secrets.OPENAEC_GPG_PRIVATE_KEY }}
          OPENAEC_GPG_PASSPHRASE: ${{ secrets.OPENAEC_GPG_PASSPHRASE }}
          OPENAEC_GPG_FINGERPRINT: ${{ vars.OPENAEC_GPG_FINGERPRINT }}
        run: bash tools/sign_linux_artifacts.sh linux-packages
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ github.sha }}
          path: linux-packages/
          if-no-files-found: error

  linux-runtime:
    needs: [route, linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        format: [deb, appimage]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-${{ github.sha }}
          path: linux-packages
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare native Linux GUI checks
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 python3-pyatspi at-spi2-core xdotool xclip imagemagick openbox ${{ matrix.os == 'ubuntu-24.04' && 'libfuse2t64' || 'libfuse2' }}
          mkdir -p "$RUNNER_TEMP/linux-proof"
          if [[ '${{ needs.route.outputs.sign }}' == true ]]; then
            bash tools/desktop-acceptance/verify_linux.sh linux-packages "$RUNNER_TEMP/linux-proof"
          fi
          sudo apt-get install -y "$(realpath linux-packages/*.deb)"
      - name: Check installed Linux package
        if: matrix.format == 'deb'
        env:
          EXPECTED_VERSION: ${{ needs.route.outputs.version }}
        run: |
          deb=$(realpath linux-packages/*.deb)
          dbus-run-session -- xvfb-run -a bash tools/check_linux_package.sh "$deb" "$EXPECTED_VERSION" "$RUNNER_TEMP/linux-proof"
      - name: Check normal FUSE AppImage launch
        if: matrix.format == 'appimage'
        run: |
          image=$(realpath linux-packages/*.AppImage)
          dbus-run-session -- xvfb-run -a bash tools/check_linux_appimage.sh "$image" "$RUNNER_TEMP/linux-proof"
      - name: Exercise signed Linux package through the native interface
        if: needs.route.outputs.sign == 'true'
        env:
          NO_AT_BRIDGE: '0'
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          if [[ "$PACKAGE_FORMAT" == appimage ]]; then
            binary=$(realpath linux-packages/*.AppImage)
            chmod +x "$binary"
            export ACCEPTANCE_BINARY="$binary"
            dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' bash -c 'openbox > "$RUNNER_TEMP/openbox.log" 2>&1 & /usr/bin/python3 tools/desktop-acceptance/scenarios.py "$ACCEPTANCE_BINARY" "$RUNNER_TEMP/linux-proof/gui" portable'
          else
            dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' bash -c 'openbox > "$RUNNER_TEMP/openbox.log" 2>&1 & /usr/bin/python3 tools/desktop-acceptance/scenarios.py /usr/bin/pile-plan-studio "$RUNNER_TEMP/linux-proof/gui"'
          fi
      - name: Record Linux runtime identity
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/linux-proof"
          uname -a > "$RUNNER_TEMP/linux-proof/os.txt"
          cat /etc/os-release >> "$RUNNER_TEMP/linux-proof/os.txt"
          node tools/release.mjs info > "$RUNNER_TEMP/linux-proof/version.json"
          git rev-parse HEAD > "$RUNNER_TEMP/linux-proof/source-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-runtime-${{ matrix.os }}-${{ matrix.format }}-${{ github.sha }}
          path: ${{ runner.temp }}/linux-proof/

  macos:
    needs: route
    if: needs.route.outputs.macos == 'true' && !inputs.macos_proof_run_id
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pile-plan-studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Prepare CMake and libclang
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: apps/pile-plan-studio
      - run: cargo test --workspace --locked
      - run: cargo test --locked --manifest-path apps/pile-plan-studio/src-tauri/Cargo.toml
      - run: npm test
        working-directory: apps/pile-plan-studio
      - name: Prepare existing Apple identity
        if: needs.route.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash tools/prepare_macos_signing.sh
      - name: Build universal app and DMG
        working-directory: apps/pile-plan-studio
        env:
          APPLE_SIGNING_IDENTITY: ${{ needs.route.outputs.sign == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args=()
          if [[ '${{ needs.route.outputs.sign }}' != true ]]; then args+=(--no-sign); fi
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg "${args[@]}"
      - name: Collect and notarize DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir macos-packages
          cp apps/pile-plan-studio/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg macos-packages/
          test "$(find macos-packages -type f | wc -l)" -eq 1
          node tools/release-assets.mjs normalize macos-packages
          if [[ '${{ needs.route.outputs.sign }}' == true ]]; then bash tools/notarize_macos_dmg.sh macos-packages/*.dmg; fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages-${{ github.sha }}
          path: macos-packages/
          if-no-files-found: error
      - name: Remove temporary Apple credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pile-plan-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/pile-plan-signing.p12" "$RUNNER_TEMP/pile-plan-notary.p8"

  macos-runtime:
    needs: [route, macos]
    if: always() && needs.route.result == 'success' && needs.route.outputs.macos == 'true' && (needs.macos.result == 'success' || inputs.macos_proof_run_id != '')
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pile-plan-studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - if: ${{ !inputs.macos_proof_run_id }}
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - run: npm ci
        if: ${{ !inputs.macos_proof_run_id }}
        working-directory: apps/pile-plan-studio
      - run: cargo test --workspace --locked
        if: ${{ !inputs.macos_proof_run_id }}
      - run: cargo test --locked --manifest-path apps/pile-plan-studio/src-tauri/Cargo.toml
        if: ${{ !inputs.macos_proof_run_id }}
      - run: npm test
        if: ${{ !inputs.macos_proof_run_id }}
        working-directory: apps/pile-plan-studio
      - name: Test verifier tools
        if: inputs.macos_proof_run_id
        run: node --test tools/release-*.test.mjs
      - name: Verify package provenance and matching application source
        id: package_source
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.macos_proof_run_id || github.run_id }}
          REUSE_RUN_ID: ${{ inputs.macos_proof_run_id }}
          SOURCE_RUNNER: ${{ matrix.os }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID" > "$RUNNER_TEMP/macos-package-source.json"
          if [[ -n "$REUSE_RUN_ID" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/macos-package-tests.json"
            node tools/verify_macos_proof_source.mjs "$RUNNER_TEMP/macos-package-source.json" "$RUNNER_TEMP/macos-package-tests.json" "$SOURCE_RUNNER" >> "$GITHUB_OUTPUT"
          else
            node tools/verify_macos_proof_source.mjs "$RUNNER_TEMP/macos-package-source.json" >> "$GITHUB_OUTPUT"
          fi
          source_sha=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/macos-package-source.json")).head_sha')
          git fetch --depth=1 origin "$source_sha"
          git diff --exit-code "$source_sha" HEAD -- apps crates Cargo.toml Cargo.lock
      - uses: actions/download-artifact@v4
        with:
          name: macos-packages-${{ steps.package_source.outputs.sha }}
          run-id: ${{ inputs.macos_proof_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: macos-packages
      - name: Inspect and launch same universal package
        env:
          EXPECTED_VERSION: ${{ needs.route.outputs.version }}
          SIGNING_MODE: ${{ needs.route.outputs.sign == 'true' && 'signed' || 'unsigned' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          mkdir -p "$RUNNER_TEMP/macos-proof"
          cp "$RUNNER_TEMP/macos-package-source.json" "$RUNNER_TEMP/macos-proof/package-source.json"
          if [[ -f "$RUNNER_TEMP/macos-package-tests.json" ]]; then cp "$RUNNER_TEMP/macos-package-tests.json" "$RUNNER_TEMP/macos-proof/source-tests.json"; fi
          bash tools/check_macos_package.sh macos-packages/*.dmg "$EXPECTED_VERSION" "$SIGNING_MODE" "$RUNNER_TEMP/macos-proof"
          sw_vers > "$RUNNER_TEMP/macos-proof/os.txt"
          uname -m >> "$RUNNER_TEMP/macos-proof/os.txt"
          node tools/release.mjs info > "$RUNNER_TEMP/macos-proof/version.json"
          git rev-parse HEAD > "$RUNNER_TEMP/macos-proof/source-sha.txt"
      - name: Prepare macOS accessibility controller
        if: needs.route.outputs.sign == 'true'
        run: bash tools/desktop-acceptance/macos-controller.sh
      - name: Exercise signed macOS app through the native interface
        if: needs.route.outputs.sign == 'true'
        run: python3 tools/desktop-acceptance/scenarios.py "$RUNNER_TEMP/macos-proof/Open Pile Plan Studio.app/Contents/MacOS/pile-plan-studio" "$RUNNER_TEMP/macos-proof/gui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-runtime-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/macos-proof/

  release-draft:
    needs: [route, windows, linux, linux-runtime, macos, macos-runtime]
    if: >-
      always() && needs.route.result == 'success' && needs.route.outputs.create_draft == 'true' &&
      needs.windows.result == 'success' && needs.linux.result == 'success' &&
      needs['linux-runtime'].result == 'success' && needs.macos.result == 'success' &&
      needs['macos-runtime'].result == 'success'
    name: Assemble verified draft release (never publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-input/windows
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-input/linux
      - uses: actions/download-artifact@v4
        with:
          name: macos-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-input/macos
      - name: Recheck Linux signatures before assembling public assets
        run: bash tools/desktop-acceptance/verify_linux.sh "$RUNNER_TEMP/release-input/linux" "$RUNNER_TEMP/release-verification"
      - name: Create or complete an unpublished draft with matching assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.route.outputs.tag }}
          RELEASE_CANDIDATE: ${{ needs.route.outputs.mode == 'release-candidate' }}
        run: node tools/create_release_draft.mjs

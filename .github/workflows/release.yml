name: Build Windows release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Prepared tag to validate (vYYYY.W.N); proof only, no signing or release creation"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Test and build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pile-plan-studio/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install frontend dependencies
        working-directory: apps/pile-plan-studio
        run: npm ci

      - name: Validate prepared version and workflow route
        id: release
        working-directory: apps/pile-plan-studio
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: npm run release:workflow -- --github-output

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test frontend
        working-directory: apps/pile-plan-studio
        run: npm test

      - name: Test Tauri shell
        run: cargo test --manifest-path apps/pile-plan-studio/src-tauri/Cargo.toml

      - name: Build NSIS installer
        working-directory: apps/pile-plan-studio
        run: npm run tauri build -- --bundles nsis

      - name: Recheck generated package versions
        working-directory: apps/pile-plan-studio
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run release:check -- --tag "$env:RELEASE_TAG"

      - name: Sign Windows installer
        if: steps.release.outputs.sign == 'true'
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          cache-dependencies: false
          files-folder: ${{ github.workspace }}/apps/pile-plan-studio/src-tauri/target/release/bundle/nsis
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Locate installer and verify release signature
        id: installer
        shell: pwsh
        env:
          VERIFY_SIGNATURE: ${{ steps.release.outputs.sign }}
        run: |
          $installers = @(Get-ChildItem "apps/pile-plan-studio/src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]

          if ($env:VERIFY_SIGNATURE -eq 'true') {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Installer signature is $($signature.Status): $($signature.StatusMessage)"
            }
            if ($signature.SignerCertificate.Subject -notmatch "Impertio Studio B\.V\.") {
              throw "Unexpected installer publisher: $($signature.SignerCertificate.Subject)"
            }
            Write-Host "Verified $($installer.Name) signed by $($signature.SignerCertificate.Subject)"
          }

          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Test installer version, installation, and launch
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          UNSIGNED_PROOF: ${{ steps.release.outputs.mode == 'proof' }}
        run: |
          ./tools/test_windows_installer.ps1 -InstallerPath $env:INSTALLER_PATH -ExpectedVersion $env:EXPECTED_VERSION -UnsignedProof:($env:UNSIGNED_PROOF -eq 'true')

      - name: Upload proof installer
        if: steps.release.outputs.mode == 'proof'
        uses: actions/upload-artifact@v4
        with:
          name: windows-proof-${{ steps.release.outputs.version }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Create draft GitHub release
        if: steps.release.outputs.create_draft == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          name: ${{ steps.release.outputs.title }}
          files: ${{ steps.installer.outputs.path }}
          fail_on_unmatched_files: true

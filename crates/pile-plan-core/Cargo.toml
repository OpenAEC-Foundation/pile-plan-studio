[package]
name = "pile-plan-core"
version = "0.4.0"
edition = "2021"
license = "LGPL-3.0-or-later"

[lib]
name = "pile_plan_core"
path = "src/lib.rs"

[features]
default = ["native-highs"]
native-highs = ["dep:highs", "dep:highs-sys"]

[dependencies]
calamine = "0.36"
csv = "1"
rust_xlsxwriter = { version = "0.99", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
highs = { version = "2.4.0", optional = true }
highs-sys = { version = "1.15.0", optional = true, features = ["highs_release"] }
